[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfirm-quant-financial-semantic-audit"
version = "1.0.0"
description = "Companion code and frozen evaluation artifacts for financial-semantic auditing"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Hongyi Zhou"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
